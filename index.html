<script>
(function () {
  var video = document.querySelector('.film');
  var button = document.getElementById('fullscreen-button');
  if (!video || !button) return;
  button.addEventListener('click', function () {
    video.play().catch(function () {});
    if (typeof video.webkitEnterFullscreen === 'function') {
      video.webkitEnterFullscreen();
      return;
    }
    var request = video.requestFullscreen || video.webkitRequestFullscreen || video.mozRequestFullScreen || video.msRequestFullscreen;
    if (request) {
      Promise.resolve(request.call(video)).catch(function () { window.location.href = video.currentSrc; });
      return;
    }
    window.location.href = video.currentSrc;
  });
})();
</script>
