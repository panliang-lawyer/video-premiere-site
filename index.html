<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#07131F">
    <meta name="description" content="一个为即将发布的视频准备的私人首映页。">
    <title>一段影像，留给此刻</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <header class="site-header">
      <a class="mark" href="#main" aria-label="返回页面开头">
        <span class="mark-dot" aria-hidden="true"></span>
        <span>私人放映室</span>
      </a>
      <span class="date">2026 · 即将上映</span>
    </header>

    <main id="main">
      <section class="hero" aria-labelledby="page-title">
        <div class="intro">
          <p class="eyebrow">A FILM IN THE MAKING</p>
          <h1 id="page-title">一段影像，<br>留给此刻。</h1>
          <p class="lede">故事还在剪辑台上慢慢成形。视频完成后，它会在这里与大家见面。</p>
        </div>

        <div class="screen-shell">
          <div class="screen" role="img" aria-label="视频尚未上线的占位画面">
            <div class="screen-light" aria-hidden="true"></div>
            <div class="screen-content">
              <span class="status-dot" aria-hidden="true"></span>
              <p class="screen-label">视频即将上线</p>
              <p class="screen-note">成片准备好后，这里将自动成为播放窗口</p>
            </div>
          </div>
          <div class="screen-meta" aria-label="视频信息">
            <span>画幅　16∶9</span>
            <span>状态　后期制作中</span>
            <span>语言　中文</span>
          </div>
        </div>
      </section>

      <section class="note" aria-labelledby="note-title">
        <p class="section-label">关于这次放映</p>
        <div>
          <h2 id="note-title">先把位置留给故事。</h2>
          <p>这个页面已经为视频准备好稳定的播放空间。之后只需加入成片、封面和片名，无须重新制作网址。</p>
        </div>
      </section>
    </main>

    <footer>
      <p>本页会随影片进度持续更新</p>
      <a href="#main">回到顶部<span aria-hidden="true"> ↑</span></a>
    </footer>
  </body>
</html>
